name: Isolated asking-market PostgreSQL rehearsal

on:
  push:
    branches: [codex-ci-local-market-reports-native-20261117]

permissions:
  contents: read

concurrency:
  group: market-reports-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  market-reports:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Read exact rehearsal operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: rehearsal-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact asking-market application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7f8a3c4682fd0037383926051e96fe155ab77583
          path: market-backend
          fetch-depth: 2
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-relay
          persist-credentials: false
      - name: Rehearse exact public market report on native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          runner="$GITHUB_WORKSPACE/rehearsal-ops/ci/market-reports/run-hosted-native.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner"
