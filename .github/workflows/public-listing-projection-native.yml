name: Isolated public listing projection proof
on:
  push:
    branches: [codex-ci-public-listing-projection-native-20261127]
permissions:
  contents: read
concurrency:
  group: public-listing-projection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' && github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false && github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 &&
      github.event.after == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read exact reviewed operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: projection-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read reviewed public projection source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 875ade946f633ce71bec23cd0c2f6bf79b7dc2ed
          path: projection-app
          fetch-depth: 2
          persist-credentials: false
      - name: Read unchanged dependency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01695530df670a94ac28f8b3bf36cc34b5b7a942
          path: projection-dependencies
          persist-credentials: false
      - name: Read pinned accepted Python recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: projection-recipe
          persist-credentials: false
      - name: Run three pure and thirteen focused owned route cases
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/projection-ops/ci/public-listing-projection-native/run-hosted.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/projection-ops" \
            "$GITHUB_WORKSPACE/projection-app" "$GITHUB_WORKSPACE/projection-dependencies" "$GITHUB_WORKSPACE/projection-recipe"
