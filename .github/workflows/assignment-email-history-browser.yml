name: Isolated assignment recovery and history browser
on:
  push:
    branches: [codex-ci-assignment-email-history-browser-v2-20261127]
permissions:
  contents: read
concurrency:
  group: assignment-email-history-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Read exact reviewed operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: build-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact reviewed combined profile frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ilovedrrealty/iLoveDRRealty
          ref: 461dacb888e492ec6e7f17e29ddaa73719c611d7
          path: frontend-source
          fetch-depth: 28
          persist-credentials: false
      - name: Read exact reviewed profile customization API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4880569cd1efefcc63b129bffa9e31373d5d5960
          path: browser-backend
          fetch-depth: 18
          persist-credentials: false
      - name: Read exact previous API for genuine99-table bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8957b18520d15dac503e0e4a5ce4b2455135d601
          path: browser-previous
          persist-credentials: false
      - name: Read unchanged dependency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01695530df670a94ac28f8b3bf36cc34b5b7a942
          path: current-platform
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-relay
          persist-credentials: false
      - name: Read accepted static Dashboard server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3007728fd67c5889a8373e41ff3ffa5cc50d839b
          path: browser-relay
          persist-credentials: false
      - name: Read exact accepted106-table migration baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26ca867a1008868f7dc5f322d28dc289a7763980
          path: profile-baseline106
          fetch-depth: 12
          persist-credentials: false
      - name: Run current571, standalone typecheck, fresh builds and both assignment browser phases
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/build-ops/ci/assignment-email-history-browser/run-hosted.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/build-ops" "$GITHUB_WORKSPACE/frontend-source" \
            "$GITHUB_WORKSPACE/current-platform" "$GITHUB_WORKSPACE/browser-backend" "$GITHUB_WORKSPACE/migration-relay" \
            "$GITHUB_WORKSPACE/browser-relay" "$GITHUB_WORKSPACE/browser-previous" "$GITHUB_WORKSPACE/profile-baseline106"
