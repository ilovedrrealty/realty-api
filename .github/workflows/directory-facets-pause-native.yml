name: Isolated directory facets and assignment pause native proof
on:
  push:
    branches: [codex-ci-directory-facets-pause-native-v2-20261127]
permissions:
  contents: read
concurrency:
  group: directory-facets-pause-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false && github.event.created == true &&
      github.event.deleted == false && github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Read exact reviewed operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: directory-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read final reviewed active directory API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f9315a9fee76f46df7ecbf8e5d67d26de1bd2d4b
          path: directory-app
          fetch-depth: 24
          persist-credentials: false
      - name: Read reviewed facet-compatible paused API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 770a633176697adcf7545fcd6117c1018a0fcaf2
          path: directory-paused
          fetch-depth: 24
          persist-credentials: false
      - name: Read accepted106-table baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26ca867a1008868f7dc5f322d28dc289a7763980
          path: directory-baseline106
          fetch-depth: 12
          persist-credentials: false
      - name: Read genuine99-table startup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8957b18520d15dac503e0e4a5ce4b2455135d601
          path: directory-previous99
          persist-credentials: false
      - name: Read unchanged dependency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01695530df670a94ac28f8b3bf36cc34b5b7a942
          path: directory-dependencies
          persist-credentials: false
      - name: Read accepted Python recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: directory-recipe
          persist-credentials: false
      - name: Run owned37 plus6 native cases, pure7 catalog, populated108 source-switch proof
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/directory-ops/ci/directory-facets-pause-native/run-hosted.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/directory-ops" \
            "$GITHUB_WORKSPACE/directory-app" "$GITHUB_WORKSPACE/directory-paused" "$GITHUB_WORKSPACE/directory-baseline106" \
            "$GITHUB_WORKSPACE/directory-previous99" "$GITHUB_WORKSPACE/directory-dependencies" \
            "$GITHUB_WORKSPACE/directory-recipe"
