name: Isolated approved listing floor plan browser rehearsal

on:
  push:
    branches: [codex-listing-floor-plans-browser-ci-20261117]

permissions:
  contents: read

concurrency:
  group: browser-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read exact rehearsal operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: browser-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact listing floor plan frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ilovedrrealty/iLoveDRRealty
          ref: 74e81bd8680565dc68b532a6b7871fe9b5db2e82
          path: frontend-base
          persist-credentials: false
      - name: Read exact backend application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eb0a47c7fe18feb5c0695608bc0ebd6d5c048298
          path: browser-backend
          persist-credentials: false
      - name: Read accepted migration dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-relay
          persist-credentials: false
      - name: Read accepted static-export fixture tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d49acd7d48e92dac6d06b1678570bc137fb6a5ba
          path: landing-relay
          persist-credentials: false
      - name: Verify Admin staging, owner approval and public mobile floor plan lifecycle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          bash --noprofile --norc -n "$GITHUB_WORKSPACE/browser-ops/ci/admin-manual-share/run-hosted-admin-manual-share.sh"
          exec bash --noprofile --norc "$GITHUB_WORKSPACE/browser-ops/ci/admin-manual-share/run-hosted-admin-manual-share.sh" \
            "$GITHUB_WORKSPACE/browser-ops" \
            "$GITHUB_WORKSPACE/frontend-base" "$GITHUB_WORKSPACE/browser-backend" \
            "$GITHUB_WORKSPACE/migration-relay" "$GITHUB_WORKSPACE/landing-relay"
