name: Isolated API connection resilience native acceptance
on:
  push:
    branches: [codex-ci-api-resilience-native-v2-20261125]
permissions:
  contents: read
concurrency:
  group: api-resilience-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read exact reviewed operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: resilience-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact reviewed connection resilience API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 07b2b7c762b129c5b6ea978299ba69e528e3189e
          path: resilience-app
          fetch-depth: 3
          persist-credentials: false
      - name: Read unchanged dependency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01695530df670a94ac28f8b3bf36cc34b5b7a942
          path: resilience-base
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: resilience-recipe
          persist-credentials: false
      - name: Run 67 source cases plus owned handshake timeout and preservation
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/resilience-ops/ci/api-resilience-native/run-hosted.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/resilience-ops" "$GITHUB_WORKSPACE/resilience-app" \
            "$GITHUB_WORKSPACE/resilience-base" "$GITHUB_WORKSPACE/resilience-recipe"
