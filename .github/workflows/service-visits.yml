name: Isolated private service visit and completion tests

on:
  push:
    branches: [codex-ci-service-visits-20261112]

permissions:
  contents: read

concurrency:
  group: service-visits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visits:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read exact test operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: visit-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact service visit application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ed9db97fd0b342bbae8f1fa0dca9fc42943bb29
          path: visit-app
          persist-credentials: false
      - name: Read reviewed dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: visit-recipe
          persist-credentials: false
      - name: Run private service workflow tests in loopback Postgres
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          bash --noprofile --norc -n "$GITHUB_WORKSPACE/visit-ops/ci/service-visits/run-hosted-service-visits.sh"
          exec bash --noprofile --norc "$GITHUB_WORKSPACE/visit-ops/ci/service-visits/run-hosted-service-visits.sh" \
            "$GITHUB_WORKSPACE/visit-ops" "$GITHUB_WORKSPACE/visit-app" "$GITHUB_WORKSPACE/visit-recipe"
