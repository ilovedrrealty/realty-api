name: Isolated profile customization and full backend native acceptance
on:
  push:
    branches: [codex-ci-profile-customization-native-v1-20261125]
permissions:
  contents: read
concurrency:
  group: profile-customization-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read exact reviewed operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: profile-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact reviewed profile customization API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a75f9c26f3bceb14afcb6e1150e1b2a3d50fbada
          path: profile-app
          fetch-depth: 10
          persist-credentials: false
      - name: Read exact accepted106-table baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 17943ba1714673c51c43cdbb800106f91612f527
          path: profile-baseline106
          fetch-depth: 6
          persist-credentials: false
      - name: Read exact previous99-table source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8957b18520d15dac503e0e4a5ce4b2455135d601
          path: profile-previous
          fetch-depth: 2
          persist-credentials: false
      - name: Read unchanged dependency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01695530df670a94ac28f8b3bf36cc34b5b7a942
          path: profile-base
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: profile-recipe
          persist-credentials: false
      - name: Run134 native cases and verify additive profile schema with106-table preservation
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/profile-ops/ci/profile-customization-native/run-hosted.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/profile-ops" "$GITHUB_WORKSPACE/profile-app" \
            "$GITHUB_WORKSPACE/profile-base" "$GITHUB_WORKSPACE/profile-recipe" "$GITHUB_WORKSPACE/profile-previous" "$GITHUB_WORKSPACE/profile-baseline106"
