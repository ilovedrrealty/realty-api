name: Isolated mobile bilingual newsletter browser journey

on:
  push:
    branches: [codex-ci-newsletter-browser-20261117]

permissions:
  contents: read

concurrency:
  group: newsletter-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  newsletter:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read exact browser operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: build-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact previous integrated frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ilovedrrealty/iLoveDRRealty
          ref: 99bc8d4c0ee4f3f0b72cf174530971f6a35f0ab3
          path: frontend-base
          persist-credentials: false
      - name: Read exact deployed frontend parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ilovedrrealty/iLoveDRRealty
          ref: b5df6a9321365e827c01df556c09b8808151e59a
          path: frontend-live
          persist-credentials: false
      - name: Read accepted static export fixture and server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d49acd7d48e92dac6d06b1678570bc137fb6a5ba
          path: landing-relay
          persist-credentials: false
      - name: Read exact newsletter backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c4d2a71f406a7d552cc2e00a38f346b180fcf45
          path: browser-backend
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-relay
          persist-credentials: false
      - name: Reconstruct actual static frontend and exercise the two synthetic mobile journeys
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          bash --noprofile --norc -n "$GITHUB_WORKSPACE/build-ops/ci/newsletter-browser/run-hosted-newsletter-browser.sh"
          exec bash --noprofile --norc "$GITHUB_WORKSPACE/build-ops/ci/newsletter-browser/run-hosted-newsletter-browser.sh" \
            "$GITHUB_WORKSPACE/build-ops" "$GITHUB_WORKSPACE/frontend-base" "$GITHUB_WORKSPACE/frontend-live" \
            "$GITHUB_WORKSPACE/landing-relay" "$GITHUB_WORKSPACE/browser-backend" "$GITHUB_WORKSPACE/migration-relay"
