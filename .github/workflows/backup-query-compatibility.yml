name: Isolated synthetic backup query compatibility

on:
  push:
    branches: [codex-ci-backup-query-compatibility-20261118]

permissions:
  contents: read

concurrency:
  group: backup-query-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read exact isolated operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: backup-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-recipe
          persist-credentials: false
      - name: Verify synthetic table maps, binary roundtrip and frozen consumers
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/backup-ops/ci/backup-query-compatibility/run-hosted.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/backup-ops" "$GITHUB_WORKSPACE/migration-recipe"
