name: Isolated narrow communications role and mobile browser rehearsal

on:
  push:
    branches: [codex-ci-f01-f03-browser-20261117]

permissions:
  contents: read

concurrency:
  group: live-communications-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  communications:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read exact browser operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: browser-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read deployed frontend base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ilovedrrealty/iLoveDRRealty
          ref: b5df6a9321365e827c01df556c09b8808151e59a
          path: frontend-base
          persist-credentials: false
      - name: Read accepted narrow frontend reconstruction recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8091437cd3cc4c1f308ca6c6c79fb9d479eac63f
          path: frontend-recipe
          persist-credentials: false
      - name: Read accepted synthetic Next build and static server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d49acd7d48e92dac6d06b1678570bc137fb6a5ba
          path: landing-relay
          persist-credentials: false
      - name: Read exact runtime-proven narrow backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7f63fec927f75af3f901f74297973253ad5c743b
          path: browser-backend
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-relay
          persist-credentials: false
      - name: Build actual pages and verify synthetic public and role journeys
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/browser-ops/ci/live-communications-browser/run-hosted-communications-browser.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/browser-ops" \
            "$GITHUB_WORKSPACE/frontend-base" "$GITHUB_WORKSPACE/frontend-recipe" "$GITHUB_WORKSPACE/landing-relay" \
            "$GITHUB_WORKSPACE/browser-backend" "$GITHUB_WORKSPACE/migration-relay"
