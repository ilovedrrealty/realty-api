name: Isolated account deletion request and review lifecycle

on:
  push:
    branches: [codex-ci-account-deletion-native-20261117]

permissions:
  contents: read

jobs:
  account-deletion:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.created == true && github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a9f84fe9d70ba35ac1eb1a1c7a96df303a20188
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c4d2a71f406a7d552cc2e00a38f346b180fcf45
          path: previous-app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: dependency-recipe
          persist-credentials: false
      - name: Rehearse requests and review with real isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/app"
          previous="$GITHUB_WORKSPACE/previous-app"
          [[ $(git -C "$source" rev-parse HEAD) == 4a9f84fe9d70ba35ac1eb1a1c7a96df303a20188 ]]
          [[ $(git -C "$source" rev-parse 'HEAD^{tree}') == 4919e5b3d54d223c7ad493b195456acf0db5da85 ]]
          [[ $(git -C "$previous" rev-parse HEAD) == 4c4d2a71f406a7d552cc2e00a38f346b180fcf45 ]]
          [[ $(git -C "$previous" rev-parse 'HEAD^{tree}') == c986f764dd3496a6da91175bc3d7f8231d1fe9b3 ]]
          [[ -z $(git -C "$source" status --porcelain) && ! -e "$source/.env" ]]
          [[ -z $(git -C "$previous" status --porcelain) && ! -e "$previous/.env" ]]
          state=$(mktemp -d "$RUNNER_TEMP/ildr-account-deletion.XXXXXXXX")
          tag="ildr-account-deletion:$GITHUB_RUN_ID"
          pg=
          trap 'if [[ -n "$pg" ]]; then docker rm -f -v "$pg" >/dev/null; fi; rm -rf -- "$state"' EXIT
          cp "$source/requirements.txt" "$state/requirements.txt"
          recipe="$GITHUB_WORKSPACE/dependency-recipe/ci/migration/services163.Dockerfile"
          printf '%s  %s\n' e546d8c5668b87ef28e604107bbb330e6f4b3873cf0208b4d24ca378bd0851f9 "$recipe" | sha256sum -c --status
          timeout --kill-after=8s 600s docker build \
            --build-arg PYTHON_DIGEST=sha256:673719e071ecf27434fd2635bbd8d00f49f4fdd81f243143438a42ced8bedf60 \
            -f "$recipe" -t "$tag" "$state" >"$state/dependencies.log" 2>&1 ||
            { echo ACCOUNT_DELETION_DEPENDENCY_PREPARATION_FAILED; exit 1; }
          pg=$(docker run -d --network none --memory 768m --memory-swap 768m --pids-limit 96 \
            --tmpfs /var/lib/postgresql/data:rw,size=384m -e POSTGRES_HOST_AUTH_METHOD=trust \
            docker.io/library/postgres:17.6@sha256:b86568d3e0fe1dfaeff52714f9da36f206a30e4c49131b82bf96982d78627409 \
            postgres -h 127.0.0.1 -p 55449)
          for step in {1..45}; do
            if docker exec "$pg" pg_isready -h 127.0.0.1 -p 55449 -U postgres; then break; fi
            sleep 1
          done
          [[ $(docker exec "$pg" ls /sys/class/net) == lo ]]
          p=(docker exec -i "$pg" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55449 -U postgres)
          "${p[@]}" -d postgres -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN'
          for stage in fresh forward; do
            db="ildr_account_deletion_${stage}_ci"
            "${p[@]}" -d postgres -c "CREATE DATABASE $db"
            "${p[@]}" -d "$db" -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role'
            if [[ "$stage" == forward ]]; then
              timeout --kill-after=8s 150s docker run --rm --network "container:$pg" --read-only \
                --memory 1g --memory-swap 1g --pids-limit 128 --tmpfs /tmp:rw \
                -v "$previous:/app:ro" -w /app "$tag" \
                env -i PATH=/usr/local/bin:/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 \
                DATABASE_URL="postgresql+psycopg2://postgres@127.0.0.1:55449/$db" JWT_SECRET=synthetic-ci-only \
                bash -euo pipefail -c '
                  test "$(ls /sys/class/net)" = lo
                  python bootstrap_db.py
                  alembic upgrade f92c8a74d31e
                '
              [[ $("${p[@]}" -d "$db" -Atc 'SELECT version_num FROM alembic_version') == f92c8a74d31e ]]
              "${p[@]}" -d "$db" <<'SQL'
          INSERT INTO users(id,email,display_name,role,status,email_verified,deletion_requested_at)
          VALUES('11111111-1111-4111-8111-111111111111','legacy-deletion@example.com',
                 'Synthetic legacy deletion','buyer','active',true,'2026-10-01T12:34:56.123456+00');
          SQL
            fi
            timeout --kill-after=8s 150s docker run --rm --network "container:$pg" --read-only \
              --memory 1g --memory-swap 1g --pids-limit 128 --tmpfs /tmp:rw \
              -v "$source:/app:ro" -w /app "$tag" \
              env -i PATH=/usr/local/bin:/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 ACCOUNT_DELETION_FIXTURE=yes \
              DATABASE_URL="postgresql+psycopg2://postgres@127.0.0.1:55449/$db" JWT_SECRET=synthetic-ci-only \
              bash -euo pipefail -c '
                test "$(ls /sys/class/net)" = lo
                python bootstrap_db.py
                alembic upgrade head
                python -m unittest discover -s tests -p test_account_deletion.py -v
              '
            [[ $("${p[@]}" -d "$db" -Atc 'SELECT version_num FROM alembic_version') == c3a914f0b628 ]]
            if [[ "$stage" == forward ]]; then
              "${p[@]}" -d "$db" <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM account_deletion_requests
                WHERE user_id='11111111-1111-4111-8111-111111111111') <> 1
              OR (SELECT count(*) FROM account_deletion_requests
                  WHERE id='11111111-1111-4111-8111-111111111111'
                    AND user_id=id AND status='pending_review' AND version=1
                    AND requested_at='2026-10-01T12:34:56.123456+00'::timestamptz) <> 1
              OR (SELECT count(*) FROM account_deletion_events
                  WHERE request_id='11111111-1111-4111-8111-111111111111') <> 1
              OR (SELECT count(*) FROM account_deletion_events
                  WHERE request_id='11111111-1111-4111-8111-111111111111'
                    AND actor_id=request_id AND action='legacy_requested' AND version=1
                    AND occurred_at='2026-10-01T12:34:56.123456+00'::timestamptz) <> 1
              OR (SELECT count(*) FROM users
                  WHERE id='11111111-1111-4111-8111-111111111111' AND status='active'
                    AND deletion_requested_at='2026-10-01T12:34:56.123456+00'::timestamptz) <> 1
            THEN RAISE EXCEPTION 'Synthetic legacy deletion backfill did not preserve exact state';
            END IF;
          END $$;
          SQL
            fi
            [[ $("${p[@]}" -d "$db" -Atc "SELECT column_default FROM information_schema.columns WHERE table_schema='public' AND table_name='account_deletion_requests' AND column_name='version'") == 1 ]]
            "${p[@]}" -d "$db" -At <<'SQL' >"$state/$stage.columns"
          SELECT c.relname,a.attnum,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull,
                 coalesce(pg_get_expr(d.adbin,d.adrelid),'')
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          JOIN pg_attribute a ON a.attrelid=c.oid
          LEFT JOIN pg_attrdef d ON d.adrelid=c.oid AND d.adnum=a.attnum
          WHERE n.nspname='public' AND c.relname IN ('account_deletion_requests','account_deletion_events')
            AND a.attnum>0 AND NOT a.attisdropped
          ORDER BY c.relname,a.attnum;
          SQL
            printf 'ACCOUNT_DELETION_NATIVE_PASS stage=%s app=4a9f84fe9d70ba35ac1eb1a1c7a96df303a20188\n' "$stage"
          done
          diff -u "$state/fresh.columns" "$state/forward.columns"
          echo ACCOUNT_DELETION_FRESH_FORWARD_COLUMN_CATALOG_EQUAL
