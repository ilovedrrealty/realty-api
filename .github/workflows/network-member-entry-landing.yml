name: Exact property viewing landing login browser rehearsal

on:
  push:
    branches: [codex-ci-property-viewings-landing-login-20261117]

permissions:
  contents: read

jobs:
  landing:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read exact rehearsal operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: member-landing-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read the accepted loopback fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 441efdc288c3a38b8607c816c684abec080d83ad
          path: member-landing-fixture
          persist-credentials: false
      - name: Read exact candidate frontend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ilovedrrealty/iLoveDRRealty
          ref: 99aa4b305991d7017f478e02e0926397ace9a445
          path: member-landing-source
          persist-credentials: false
      - name: Read the exact candidate backend source for pair identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 703158f0df31ed2abfae762688f2d8c15c46e274
          path: member-landing-backend
          persist-credentials: false
      - name: Verify static export, property viewing and shortlist sign-in in Chromium
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          script="$GITHUB_WORKSPACE/member-landing-ops/ci/cumulative-landing/run-member-entry.sh"
          bash --noprofile --norc -n "$script"
          exec bash --noprofile --norc "$script" "$GITHUB_WORKSPACE/member-landing-ops" \
            "$GITHUB_WORKSPACE/member-landing-fixture" "$GITHUB_WORKSPACE/member-landing-source" \
            "$GITHUB_WORKSPACE/member-landing-backend"
