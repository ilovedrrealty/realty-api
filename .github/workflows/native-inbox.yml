name: Isolated native Inbox migration and authorization acceptance
on:
  push:
    branches: [codex-ci-native-inbox-v2-20261125]
permissions:
  contents: read
concurrency:
  group: native-inbox-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read exact reviewed operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: inbox-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact reviewed private Inbox API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c8b085f9a583ca757cece9ea4ea46c169aab638
          path: inbox-app
          fetch-depth: 3
          persist-credentials: false
      - name: Read exact previous99-table source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8957b18520d15dac503e0e4a5ce4b2455135d601
          path: inbox-previous
          fetch-depth: 2
          persist-credentials: false
      - name: Read unchanged dependency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01695530df670a94ac28f8b3bf36cc34b5b7a942
          path: inbox-base
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: inbox-recipe
          persist-credentials: false
      - name: Run 27 native cases and verify full 99 to 106 migration
        shell: bash
        run: |
          set -euo pipefail
          runner="$GITHUB_WORKSPACE/inbox-ops/ci/native-inbox/run-hosted.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner" "$GITHUB_WORKSPACE/inbox-ops" "$GITHUB_WORKSPACE/inbox-app" \
            "$GITHUB_WORKSPACE/inbox-base" "$GITHUB_WORKSPACE/inbox-recipe" "$GITHUB_WORKSPACE/inbox-previous"
