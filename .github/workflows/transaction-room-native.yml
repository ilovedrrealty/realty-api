name: Isolated private service referrals and cumulative PostgreSQL rehearsal

on:
  push:
    branches: [codex-ci-private-service-referrals-20261117]

permissions:
  contents: read

concurrency:
  group: transaction-room-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Read exact rehearsal operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: rehearsal-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact private service referrals backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8863b78437fe69be22725d44831c1da1b99223f0
          path: transaction-backend
          persist-credentials: false
      - name: Read exact prior application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 630f05b80384428bb1191d3475a765877def80a9
          path: previous-backend
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-relay
          persist-credentials: false
      - name: Rehearse private referrals and inherited PostgreSQL contracts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          runner="$GITHUB_WORKSPACE/rehearsal-ops/ci/transaction-room/run-hosted-native.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner"
