name: Isolated integrated migration with existing trade contacts

on:
  push:
    branches: [codex-ci-integrated-trade-directory-native-20261117]

permissions:
  contents: read

concurrency:
  group: transaction-room-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: >-
      github.repository == 'ilovedrrealty/realty-api' &&
      github.event.repository.private == false &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1 && github.event.after == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Read exact rehearsal operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: rehearsal-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact integrated application backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c5ac614398fae413d231c28a51e703bb297e0bb9
          path: transaction-backend
          persist-credentials: false
      - name: Read exact previous combined application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eb0a47c7fe18feb5c0695608bc0ebd6d5c048298
          path: previous-backend
          persist-credentials: false
      - name: Read exact deployed trade directory application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1ae9c9f2ccf3bdd3ac36b11b0da76486d7889838
          path: trade-backend
          persist-credentials: false
      - name: Read accepted Python dependency recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c193a925ba57ea2d67ea48c44e5262817885c8a2
          path: migration-relay
          persist-credentials: false
      - name: Rehearse both upgrade paths, private access and archive restore
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          runner="$GITHUB_WORKSPACE/rehearsal-ops/ci/transaction-room/run-hosted-native.sh"
          bash --noprofile --norc -n "$runner"
          exec bash --noprofile --norc "$runner"
