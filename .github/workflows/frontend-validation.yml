name: Exact frontend strict build validation (synthetic landing, no publication)
on:
  push:
    branches: [codex-ci-services-frontend-order-20261102]
permissions:
  contents: read
concurrency:
  group: exact-frontend-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OVERLAY_MANIFEST_SHA256: 45d69ba856c72c4dd9b342e7084f0fb604957d617802b13d3d4613fc64c72891
    steps:
      - name: Require exact initial backend branch event
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          PUSH_CREATED: ${{ github.event.created }}
          PUSH_DELETED: ${{ github.event.deleted }}
          PUSH_FORCED: ${{ github.event.forced }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == ilovedrrealty/realty-api ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/codex-ci-services-frontend-order-20261102 ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$REPOSITORY_PRIVATE" == false ]]
          [[ "$PUSH_CREATED" == true && "$PUSH_DELETED" == false && "$PUSH_FORCED" == false ]]
          [[ "$PUSH_BEFORE" == 0000000000000000000000000000000000000000 ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$PUSH_AFTER" == "$GITHUB_SHA" && "$WORKFLOW_SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$OVERLAY_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Read the exact reviewed backend CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: backend-ci
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read only the exact frontend base (no frontend push)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ilovedrrealty/iLoveDRRealty
          ref: 73d771940e73d42ed044cea77a5258a93a445b05
          path: frontend-base
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify fixed operational source before execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'backend-ci'
          pins = {
              'ci/frontend/frontend_ci_host.py': '741823a5585c1bd396d8a05b04a0cdb47c41c1fee680ee128fd9de535c1da8d1',
              'ci/frontend/run_frontend_ci.cjs': '34601a2c8eec8d56749b0664af0299835c755ae74a77c6a9b5d84e942c689db7',
              'ci/frontend/landing_fixture.cjs': 'a166dc60598e76b7fdcc3fe2aa5253bc56952b48fd99e4cab5eb4a24523a548e',
              'ci/frontend/landing_fixture.test.cjs': '0a1abbdbd65a82e67ded20a0603a21fc9321a1b1aa5fd83dbccf1c049ffc4110',
              'ci/frontend/frontend-overlay.json': os.environ['OVERLAY_MANIFEST_SHA256'],
          }
          for name, expected in pins.items():
              current = root
              for part in name.split('/'):
                  current /= part
                  if current.is_symlink(): raise SystemExit('OPERATIONAL_SYMLINK_REFUSED')
              if not current.is_file() or hashlib.sha256(current.read_bytes()).hexdigest() != expected:
                  raise SystemExit('EXACT_OPERATIONAL_SOURCE_REQUIRED')
          PY
      - name: One bounded locked install and isolated full validation
        shell: bash
        run: |
          set -euo pipefail
          # No frontend Git push, deploy command, artifact/cache upload or secrets.
          # The landing export uses owned synthetic loopback data and is discarded.
          timeout --signal=TERM --kill-after=30s 1950s python3 -I -S -B backend-ci/ci/frontend/frontend_ci_host.py
